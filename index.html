
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123d70">
<title>JmoLasik</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f3f5f9;
 color:#202633;
}
header{
 background:#123d70;
 color:white;
 padding:22px 16px;
}
header h2{margin:0;font-size:24px}
header p{margin:7px 0 0;font-size:13px}
main{max-width:1200px;margin:auto;padding:16px}
.card{
 background:white;
 padding:16px;
 border-radius:12px;
 box-shadow:0 2px 10px #0001;
}
.search{
 width:100%;
 padding:14px;
 border:1px solid #ddd;
 border-radius:8px;
 font-size:15px;
 margin-bottom:12px;
}
button{
 background:#123d70;
 color:white;
 border:0;
 border-radius:8px;
 padding:11px 16px;
 font-size:14px;
 cursor:pointer;
 margin-bottom:12px;
}
.info{font-size:13px;color:#666;margin-bottom:12px}
.table-wrap{overflow-x:auto}
table{
 border-collapse:collapse;
 width:100%;
 min-width:950px;
}
th,td{
 padding:12px;
 border-bottom:1px solid #eee;
 text-align:left;
 font-size:13px;
 white-space:nowrap;
}
th{background:#eaf1fa;color:#123d70}
.empty{text-align:center;color:#777;padding:25px}
footer{text-align:center;color:#777;font-size:12px;padding:20px}
</style>
</head>

<body>

<header>
<h2>JmoLasik</h2>
<p>Informasi Data JmoLasik</p>
</header>

<main>
<div class="card">

<input
 class="search"
 id="cari"
 placeholder="Cari Kode, Kab, Kec, Kel, KPJ..."
>

<button id="muat">Muat Ulang Data</button>

<div class="info" id="jumlah">Menghubungkan Firebase...</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Kode</th>
<th>Kab</th>
<th>Kec</th>
<th>Kel</th>
<th>Saldo</th>
<th>IUT</th>
<th>GEN</th>
<th>Tanggal Lahir</th>
<th>PT</th>
<th>KPJ</th>
<th>Status</th>
</tr>
</thead>

<tbody id="hasil">
<tr>
<td colspan="11" class="empty">Memuat data...</td>
</tr>
</tbody>
</table>
</div>

</div>
</main>

<footer>JmoLasik</footer>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import {
 getFirestore,
 collection,
 getDocs
}
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyD7dhu7KiCEWkyuvdHvg4qE8nVDgCLJrtk",
 authDomain: "jmolasik-df212.firebaseapp.com",
 projectId: "jmolasik-df212",
 storageBucket: "jmolasik-df212.firebasestorage.app",
 messagingSenderId: "716394929936",
 appId: "1:716394929936:web:4fd24e2b3fdd1b05370f95"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const kolom = [
 "Kode",
 "Kab",
 "Kec",
 "Kel",
 "Saldo",
 "IUT",
 "GEN",
 "Tanggal Lahir",
 "PT",
 "KPJ",
 "Status"
];

let semuaData = [];

const pencarian = document.getElementById("cari");
const hasil = document.getElementById("hasil");
const jumlah = document.getElementById("jumlah");

function tampilkan(){

 const kata = pencarian.value.toLowerCase().trim();

 const dataFilter = semuaData.filter(item =>
  kolom.some(k =>
   String(item[k] ?? "").toLowerCase().includes(kata)
  )
 );

 hasil.innerHTML = "";

 if(dataFilter.length === 0){
  const tr = document.createElement("tr");
  const td = document.createElement("td");
  td.colSpan = 11;
  td.className = "empty";
  td.textContent = "Data tidak ditemukan";
  tr.appendChild(td);
  hasil.appendChild(tr);
 }else{

  dataFilter.forEach(item => {

   const tr = document.createElement("tr");

   kolom.forEach(k => {
    const td = document.createElement("td");
    td.textContent = item[k] ?? "";
    tr.appendChild(td);
   });

   hasil.appendChild(tr);
  });
 }

 jumlah.textContent =
  dataFilter.length + " data ditemukan";
}

async function muatData(){

 jumlah.textContent = "Mengambil data Firebase...";
 hasil.innerHTML =
  '<tr><td colspan="11" class="empty">Mohon tunggu...</td></tr>';

 try{

  const snapshot = await getDocs(
   collection(db,"data_jmolasik")
  );

  semuaData = snapshot.docs.map(doc => doc.data());

  tampilkan();

  if(semuaData.length === 0){
   jumlah.textContent =
    "Koleksi ditemukan, tetapi belum ada dokumen.";
  }

 }catch(error){

  console.error(error);

  semuaData = [];

  jumlah.textContent =
   "Gagal mengambil data: " + error.message;

  hasil.innerHTML =
   '<tr><td colspan="11" class="empty">Periksa koneksi dan aturan Firestore.</td></tr>';
 }
}

pencarian.addEventListener("input", tampilkan);
document.getElementById("muat").addEventListener("click", muatData);

muatData();

</script>

</body>
</html>
